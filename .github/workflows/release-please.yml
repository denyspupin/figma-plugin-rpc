name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g., v0.3.1)'
        required: true
        type: string

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          package-name: figma-plugin-rpc

  publish:
    needs: release-please
    if: >-
      always() &&
      (
        (github.event_name == 'push' &&
          needs.release-please.outputs.release_created == 'true') ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish-${{ inputs.tag || needs.release-please.outputs.tag_name }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}

    steps:
      - name: Checkout released tag
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Validate release tag
        shell: bash
        run: |
          package_version="$(node --print "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "${RELEASE_TAG}" != "${expected_tag}" ]]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match package version ${package_version}."
            exit 1
          fi

      - name: Check npm registry
        id: registry
        shell: bash
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"

          if npm view "${package_name}@${package_version}" version --json >/dev/null 2>&1; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
            echo "${package_name}@${package_version} is already published; skipping."
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install dependencies
        if: steps.registry.outputs.already_published != 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.registry.outputs.already_published != 'true'
        run: pnpm test

      - name: Publish to npm
        if: steps.registry.outputs.already_published != 'true'
        run: npm publish --access public
